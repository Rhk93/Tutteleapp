<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Classe Chitarra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Classe chitarra Ignazio Paolicelli</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg1:#2b1a10; --bg2:#0b0705; --card:#1a110b; --testo:#f4e9d6; --accento:#c9a45c;
  --raggio:14px; --font:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; --colonne:2; --anteprimaH:1.45;
  --sans:var(--font);
  --opChitarra:.55;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font); color:var(--testo);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
#sfondoChitarra{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sfondoChitarra svg{position:absolute;height:118vh;width:auto;top:-6vh;opacity:var(--opChitarra);
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.6));transition:all .4s}
#sfondoChitarra.destra svg{right:-4vh;transform:rotate(16deg)}
#sfondoChitarra.sinistra svg{left:-4vh;transform:rotate(-16deg)}
#sfondoChitarra.centro svg{left:50%;transform:translateX(-50%)}
#sfondoChitarra.spenta{display:none}
/* modalità banner: chitarra orizzontale dietro il titolo */
#sfondoChitarra.banner{position:absolute;top:0;left:0;right:0;bottom:auto;height:calc(var(--altBanner,340px) + env(safe-area-inset-top));
  -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
#sfondoChitarra.banner svg{height:clamp(560px,165vw,1050px);top:50%;left:34%;
  transform:translate(-50%,-50%) rotate(-80deg)}
@media (min-width:700px){ #sfondoChitarra.banner svg{left:42%} }
#sfondoChitarra.banner:after{background:radial-gradient(ellipse 60% 55% at 50% 45%,color-mix(in srgb,var(--bg2) 55%,transparent),transparent 80%),
  linear-gradient(transparent 60%,var(--bg1))}
#sfondoChitarra:after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 30%,transparent 0%,color-mix(in srgb,var(--bg2) 70%,transparent) 100%)}
header,main,footer{position:relative;z-index:1}
button{cursor:pointer}

/* ---------- HOME ---------- */
header{
  text-align:center; padding:calc(22px + env(safe-area-inset-top)) 16px 14px; position:relative;
}
header{padding-top:calc(48px + env(safe-area-inset-top)) !important;padding-bottom:30px !important;min-height:250px}
header h1{font-size:calc(clamp(1.9rem,8vw,3.4rem) * var(--scT,1)); line-height:1.08; letter-spacing:-.025em; font-weight:700;
  text-shadow:0 2px 14px rgba(0,0,0,.55); max-width:20ch; margin:0 auto; text-wrap:balance}
.fregio{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px auto 4px;color:var(--accento);max-width:340px}
.fregio:before,.fregio:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accento))}
.fregio:after{background:linear-gradient(90deg,var(--accento),transparent)}
.fregio svg{width:26px;height:26px}
header h1 .nota{color:var(--accento)}
#titolo{display:block}
#nomeTit{display:block;font-size:var(--scN,.5em);font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin-top:.35em;opacity:.92}
header p{opacity:.85;margin-top:4px;font-size:calc(1.05rem * var(--scS,1));font-weight:500;letter-spacing:-.01em}
.btnImpost{color:var(--accento);display:flex;align-items:center;justify-content:center;
  position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px;
  width:44px;height:44px;border-radius:50%;font-size:1.2rem;
  background:rgba(0,0,0,.3); backdrop-filter:blur(6px); border:1px solid color-mix(in srgb,var(--accento) 50%,transparent);
}
.btnImpost:active{transform:scale(.92)}
main{max-width:1100px;margin:0 auto;padding:8px 14px 30px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,min(var(--larg,160px),100%));gap:14px;justify-content:center}
.app{container-type:inline-size}
.info .nome{font-size:calc(clamp(.8rem,10cqw,1.35rem) * var(--scA,1)) !important}
.info .descr{font-size:calc(clamp(.66rem,6.2cqw,.85rem) * var(--scA,1)) !important}
@container (max-width:125px){ .info .descr{display:none} .info .nome .tile{display:none} }
.zoom{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;display:flex;gap:6px;z-index:2}
.zoom button{width:44px;height:44px;border-radius:50%;font-size:1.5rem;line-height:1;color:var(--accento);
  background:rgba(0,0,0,.3);backdrop-filter:blur(6px);border:1px solid color-mix(in srgb,var(--accento) 50%,transparent)}
.zoom button:active{transform:scale(.9)}
.zoom button{display:flex;align-items:center;justify-content:center}
#barraOrdina{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;
  background:#fff;color:#2b1a3a;border-radius:30px;padding:8px 8px 8px 18px;gap:12px;align-items:center;
  font-family:var(--font);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
#barraOrdina button{border:none;border-radius:22px;padding:10px 16px;background:#2ed15f;color:#fff;font-weight:700}
body.ordina #barraOrdina{display:flex}
body.ordina .app{touch-action:none;animation:trema .3s ease-in-out infinite alternate;cursor:grab}
body.ordina .app:nth-child(2n){animation-delay:-.15s}
body.ordina .app iframe{display:none}
body.ordina .app.presa{animation:none;opacity:.9;z-index:5;cursor:grabbing;box-shadow:0 18px 30px rgba(0,0,0,.5)}
@keyframes trema{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.app{
  background:var(--card); background:color-mix(in srgb,var(--card) 72%,transparent);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-radius:var(--raggio); overflow:hidden; position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  transition:transform .15s, border-color .15s; display:flex; flex-direction:column;
  text-align:left; padding:0; width:100%;
  border:1px solid color-mix(in srgb,var(--accento) 35%,transparent);
}
.app:active{transform:scale(.97)}
.app:hover{border-color:var(--accento)}
.anteprima{
  position:relative; width:100%; aspect-ratio:1/var(--anteprimaH); overflow:hidden;
  background:var(--card);
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--colApp) 45%,var(--card)),color-mix(in srgb,var(--colApp) 12%,var(--card)));
}
.anteprima iframe{
  position:absolute; top:0; left:0; width:400px; height:calc(400px * var(--anteprimaH));
  border:0; transform-origin:0 0; transform:scale(var(--scala,.4)); pointer-events:none; background:#fff;
}
.tile{
  display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;
  background:var(--colApp);
  background:linear-gradient(145deg,color-mix(in srgb,var(--colApp) 78%,#fff),color-mix(in srgb,var(--colApp) 82%,#000));
  border-radius:26%; box-shadow:0 4px 12px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.35);
}
.tile svg{width:64%;height:64%;display:block}
.tile .emo{font-size:1em;line-height:1}
body.stile-cerchio .tile{border-radius:50%}
.tile{position:relative;overflow:hidden}
body.stile-allegra .tile, .tile.allegra{
  background:linear-gradient(150deg,color-mix(in srgb,var(--colApp) 55%,#fff) 0%,var(--colApp) 55%,color-mix(in srgb,var(--colApp) 80%,#000) 100%);
  border-radius:30%; box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.45)}
body.stile-allegra .tile:after, .tile.allegra:after{content:"";position:absolute;left:8%;right:8%;top:5%;height:38%;border-radius:50%;
  background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
.tile svg.colorata{width:80%;height:80%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
body.stile-allegra .app:hover .anteprima .tile{transform:rotate(-6deg) scale(1.06)}
.anteprima .tile{transition:transform .25s}
/* ===== Riquadri ALLEGRI ===== */
body.stile-allegra .app{
  background:linear-gradient(165deg,color-mix(in srgb,var(--colApp) 45%,#fff) 0%,var(--colApp) 70%);
  border:3px solid rgba(255,255,255,.85); border-radius:calc(var(--raggio) + 12px);
  box-shadow:0 7px 0 color-mix(in srgb,var(--colApp) 60%,#000), 0 12px 22px rgba(0,0,0,.35);
  -webkit-backdrop-filter:none; backdrop-filter:none; margin-bottom:7px; color:#fff;
  transition:transform .12s, box-shadow .12s}
body.stile-allegra .app:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--colApp) 60%,#000),0 4px 10px rgba(0,0,0,.3)}
body.stile-allegra .app:hover{border-color:#fff}
body.stile-allegra .anteprima{background:none;aspect-ratio:auto;height:auto;padding:10% 0 0}
body.stile-allegra .anteprima .velo{display:none}
body.stile-allegra .anteprima .segnaposto{position:relative;inset:auto}
body.stile-allegra .anteprima .segnaposto .tile{width:72%;background:none;box-shadow:none;border-radius:0;aspect-ratio:1;
}
body.stile-allegra .anteprima .segnaposto .tile:after{display:none}
body.stile-allegra .app:nth-child(2n) .tile{animation-delay:-1.5s}
body.stile-allegra .tile svg.colorata{width:100%;height:100%;filter:drop-shadow(0 4px 3px rgba(0,0,0,.28))}
@keyframes dondola{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-4px)}}
body.stile-allegra .anteprima.live{aspect-ratio:1/var(--anteprimaH);margin:8px 8px 0;width:auto;border-radius:16px;overflow:hidden;padding:0;border:2px solid rgba(255,255,255,.8)}
body.stile-allegra .anteprima.live .segnaposto{position:absolute;inset:0}
body.stile-allegra .info{border-top:none;text-align:center;padding:6px 8px 12px}
body.stile-allegra .info .nome{justify-content:center;font-family:var(--font);font-weight:700;letter-spacing:-.01em;
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
body.stile-allegra .info .nome .tile{display:none}
body.stile-allegra .anteprima.live + .info .nome .tile{display:inline-flex;width:26px;height:26px;background:none;box-shadow:none}
body.stile-allegra .anteprima.live + .info .nome .tile:after{display:none}
body.stile-allegra .info .descr{color:#fff;opacity:.92;font-weight:700}
@media (prefers-reduced-motion:reduce){ body.stile-allegra .anteprima .segnaposto .tile{animation:none} }
body.stile-linea .tile{background:none;box-shadow:none;color:var(--colApp)}
body.stile-linea .tile svg{width:92%;height:92%}
.logo{width:64px;height:64px;margin:0 auto 10px;--colApp:var(--accento);font-size:30px}
.anteprima .segnaposto .tile{width:56%;aspect-ratio:1;font-size:clamp(2.4rem,11vw,4.5rem)}
.info .tile{width:30px;height:30px;font-size:18px}
.anteprima .segnaposto{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:clamp(3rem,14vw,5.5rem);
}
.anteprima .velo{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.55))}
.info{padding:10px 12px 12px; border-top:1px solid color-mix(in srgb,var(--accento) 35%,transparent)}
.info .nome{font-weight:700;font-size:1.22rem;letter-spacing:-.01em;display:flex;gap:9px;align-items:center;line-height:1.1}
.info .descr{font-family:var(--sans);font-size:.78rem;opacity:.72;margin-top:5px;line-height:1.35}
.vuoto{text-align:center;opacity:.7;padding:40px}
footer{text-align:center;opacity:.7;font-size:.95rem;padding:14px 0 26px;letter-spacing:.04em;margin:10px auto 0;max-width:420px;border-top:1px solid color-mix(in srgb,var(--accento) 30%,transparent)}

/* ---------- VISORE APP ---------- */
#visore{position:fixed;inset:0;z-index:50;background:var(--bg2);display:none;flex-direction:column}
#visore.aperto{display:flex}
.barraVisore{
  display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;
  background:var(--card); border-bottom:3px solid var(--accento);
}
.barraVisore button{
  border:none;background:rgba(255,255,255,.12);border-radius:12px;height:40px;min-width:40px;
  padding:0 12px;font-size:1rem;
}
.barraVisore .titolo{flex:1;font-weight:700;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frameApp{flex:1;width:100%;border:0;background:#fff}
#caricamento{position:absolute;left:0;right:0;top:calc(56px + env(safe-area-inset-top));height:3px;
  background:var(--accento);animation:carica 1.2s infinite ease-in-out;display:none}
@keyframes carica{0%{transform:scaleX(0);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}
  51%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}

/* ---------- PANNELLO IMPOSTAZIONI ---------- */
#pannello{position:fixed;inset:0;z-index:60;display:none}
#pannello.aperto{display:block}
#pannello .sfondo{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#pannello .contenuto{
  position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);overflow-y:auto;
  background:#1d1d22;color:#f2f2f2;font-family:var(--font);
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));
}
.contenuto h2{font-size:1.25rem;display:flex;justify-content:space-between;align-items:center}
.contenuto h3{font-size:.95rem;margin:20px 0 8px;color:#ffc46b;text-transform:uppercase;letter-spacing:1px}
.riga{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.riga label{flex:1;font-size:.95rem}
.riga label.toggle{flex:none}
.contenuto input[type=text],.contenuto input[type=url],.contenuto select,.contenuto textarea{
  width:100%;background:#2c2c33;border:1px solid #444;border-radius:10px;padding:9px 10px;color:#fff
}
.contenuto input[type=color]{width:52px;height:36px;border:none;background:none;padding:0}
.contenuto input[type=range]{flex:1}
.btn{border:none;border-radius:10px;padding:10px 14px;background:#3a3a44;color:#fff;font-size:.92rem}
.btn.primario{background:#e8952b;color:#1a1a1a;font-weight:bold}
.btn.pericolo{background:#8b2b2b}
.btn.piccolo{padding:6px 10px;font-size:.85rem}
.chiudi{border:none;background:#3a3a44;width:40px;height:40px;border-radius:50%;font-size:1.1rem}
.temi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tema{border:2px solid transparent;border-radius:12px;padding:10px 4px;font-size:.8rem;color:#fff;text-shadow:0 1px 3px #000}
.tema:active{transform:scale(.95)}
.schedaApp{background:#2a2a31;border-radius:12px;padding:10px;margin:10px 0;border-left:6px solid var(--c)}
.schedaApp .testa{display:flex;align-items:center;gap:6px}
.schedaApp .testa .sceltaIcona{border:none;background:none;padding:0;width:44px;height:44px;flex:none}
.schedaApp .testa .sceltaIcona .tile{width:44px;height:44px;font-size:24px}
.galleria{display:none;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px;background:#1d1d22;padding:8px;border-radius:10px}
.galleria.aperta{display:grid}
.galleria button{border:2px solid transparent;background:none;padding:0;aspect-ratio:1;border-radius:12px}
.galleria button.sel{border-color:#ffc46b}
.galleria .tile{width:100%;height:100%;font-size:20px}
.galleria .riga-emoji{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:.85rem}
.galleria .riga-emoji input{flex:1}
.stili{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stili button{background:#2c2c33;border:2px solid transparent;border-radius:12px;padding:8px 4px;font-size:.8rem;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px}
.stili button.sel{border-color:#ffc46b}
.stili .tile{width:40px;height:40px;--colApp:#e5533d}
.schedaApp .testa .nomeApp{flex:1;font-weight:600;font-size:1rem}
.schedaApp .campi{display:grid;gap:6px;margin-top:8px}
.schedaApp .azioni{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.schedaApp.nascosta{opacity:.5}
.toggle{position:relative;width:50px;height:28px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#555;border-radius:28px;transition:.2s}
.toggle span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:#e8952b}
.toggle input:checked+span:before{transform:translateX(22px)}
.nota-p{font-size:.8rem;opacity:.65;margin-top:4px;line-height:1.35}
#avviso{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);
  background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;transition:.3s;white-space:nowrap;pointer-events:none;font-family:var(--font);font-size:.9rem}
#avviso.vedi{transform:translateX(-50%) translateY(0)}
</style>
</head>

function clona(o){ return JSON.parse(JSON.stringify(o)); }
function carica(){
  try{
    const s = localStorage.getItem(CHIAVE);
    if(s){ return sistema(JSON.parse(s)); }
  }catch(e){}
  return clona(PREDEFINITE);
}
function sistema(o){
  const c = Object.assign(clona(PREDEFINITE), o, { colori:Object.assign({},PREDEFINITE.colori,o.colori||{}) });
  if([TITOLO_VECCHIO,'Classe chitarra Paolicelli Ignazio','Classe chitarra Ignazio Paolicelli'].includes(c.titolo)){ c.titolo='Classe chitarra'; c.nome='Ignazio Paolicelli'; }
  if(c.nome===undefined) c.nome='';
  ['scT','scN','scS','scA'].forEach(k=>{ if(typeof c[k]!=='number') c[k]=PREDEFINITE[k]; });
  if(!c.grandezza) c.grandezza = PREDEFINITE.grandezza;
  if(!c.v3){ // passaggio alle icone allegre
    const vivaci = {"#a8432f": "#ff7a3d", "#3f6e8c": "#2f8cf0", "#4f7a52": "#3cbf5c", "#6d4f8a": "#a35be8", "#b88a2e": "#ffb31f", "#8a5a3b": "#1fc2b0"};
    if(c.stileIcone==='riquadro') c.stileIcone='allegra';
    c.app.forEach(a=>{ if(vivaci[a.colore]) a.colore = vivaci[a.colore]; });
    c.v3 = true;
  }
  c.stileIcone='allegra';
  // testi fissi: sempre quelli originali
  ['titolo','nome','sottotitolo','piede'].forEach(k=>{ c[k]=PREDEFINITE[k]; });
  c.live = false;
  c.app = c.app.filter(a=>PREDEFINITE.app.some(p=>p.id===a.id));
  c.app.forEach(a=>{ const p=PREDEFINITE.app.find(p=>p.id===a.id); a.nome=p.nome; a.descr=p.descr; a.url=p.url; });
  if(!c.v5){ c.font = PREDEFINITE.font; c.v5=true; }
  if(!c.v4){ // riquadri allegri e più piccoli
    const vivaci = {"#ff7a3d": "#ff7b29", "#2f8cf0": "#1fa2ff", "#3cbf5c": "#2ed15f", "#a35be8": "#a45cff", "#ffb31f": "#ffb000", "#1fc2b0": "#ff4fa3"};
    c.app.forEach(a=>{ if(vivaci[a.colore]) a.colore = vivaci[a.colore]; });
    c.stileIcone='allegra';
  // testi fissi: sempre quelli originali
  ['titolo','nome','sottotitolo','piede'].forEach(k=>{ c[k]=PREDEFINITE[k]; });
  c.live = false;
  c.app = c.app.filter(a=>PREDEFINITE.app.some(p=>p.id===a.id));
  c.app.forEach(a=>{ const p=PREDEFINITE.app.find(p=>p.id===a.id); a.nome=p.nome; a.descr=p.descr; a.url=p.url; }); if(c.grandezza>=160) c.grandezza=120;
    c.v4 = true;
  }
  c.app.forEach(a=>{ if(!a.icona){ a.icona = ICONE_DEF[a.id] || 'nota'; } delete a.emoji; });
  // aggiunge le app nuove (se non sono state eliminate apposta)
  c.rimosse = c.rimosse || [];
  PREDEFINITE.app.forEach(p=>{ if(!c.app.some(a=>a.id===p.id) && !c.rimosse.includes(p.id)) c.app.push(clona(p)); });
  return c;
}

        ${cfg.live ? `<iframe loading="lazy" tabindex="-1" aria-hidden="true" scrolling="no" src="${esc(a.url)}"></iframe>` : ''}

        ${a.descr ? `<div class="descr">${esc(a.descr)}</div>` : ''}
      </div>`;
    b.dataset.id = a.id;
    b.onclick = () => { if(document.body.classList.contains('ordina') || b._premuto) return; apriApp(a); };

/* ---------- Riordino: tieni premuto o tasto ⇅, poi trascina ---------- */
function entraOrdina(){ document.body.classList.add('ordina'); avviso('Trascina le app nella posizione che vuoi'); }
function esciOrdina(){ document.body.classList.remove('ordina'); salvaOrdine(); }
function salvaOrdine(){
  const ids = [...$('griglia').querySelectorAll('.app')].map(e=>e.dataset.id);
  const visibili = cfg.app.filter(a=>a.visibile);
  const perId = Object.fromEntries(cfg.app.map(a=>[a.id,a]));
  let k = 0;
  cfg.app = cfg.app.map(a => a.visibile ? perId[ids[k++]] || a : a);
  salva();
}
function attivaTrascina(el){
  let timer=null, presa=false, x0=0, y0=0;
  el.addEventListener('pointerdown', e=>{
    x0=e.clientX; y0=e.clientY; el._premuto=false;
    if(document.body.classList.contains('ordina')){ inizia(e); return; }
    timer = setTimeout(()=>{ el._premuto=true; entraOrdina(); if(navigator.vibrate) try{navigator.vibrate(30)}catch(_){} inizia(e); }, 550);
  });
  el.addEventListener('pointermove', e=>{
    if(timer && Math.hypot(e.clientX-x0,e.clientY-y0)>10){ clearTimeout(timer); timer=null; }
    if(!presa) return;
    e.preventDefault();
    el.style.transform = `translate(${e.clientX-x0}px,${e.clientY-y0}px) scale(1.06)`;
    el.style.pointerEvents='none';
    const sotto = document.elementFromPoint(e.clientX,e.clientY);
    el.style.pointerEvents='';
    const altro = sotto && sotto.closest && sotto.closest('.app');
    if(altro && altro!==el && altro.parentNode===el.parentNode){
      const prima = el.getBoundingClientRect();
      const lista=[...el.parentNode.children];
      if(lista.indexOf(altro) > lista.indexOf(el)) altro.after(el); else altro.before(el);
      const dopo = el.getBoundingClientRect();
      x0 += dopo.left-prima.left; y0 += dopo.top-prima.top;
      el.style.transform = `translate(${e.clientX-x0}px,${e.clientY-y0}px) scale(1.06)`;
    }
  });
  const fine = ()=>{
    clearTimeout(timer); timer=null;
    if(presa){ presa=false; el.classList.remove('presa'); el.style.transform=''; salvaOrdine(); }
    setTimeout(()=>{ el._premuto=false; }, 50);
  };
  el.addEventListener('pointerup', fine); el.addEventListener('pointercancel', fine);
  el.addEventListener('contextmenu', e=>e.preventDefault());
  function inizia(e){ presa=true; el.classList.add('presa'); try{ el.setPointerCapture(e.pointerId); }catch(_){}
    // con la cattura, elementFromPoint funziona lo stesso
  }
}
$('zOrdina').onclick = ()=> document.body.classList.contains('ordina') ? esciOrdina() : entraOrdina();
$('fineOrdina').onclick = esciOrdina;
document.body.appendChild($('barraOrdina'));

// Rimpicciolisce l'anteprima per farla stare nel riquadro
function aggiornaScale(){
  document.querySelectorAll('.anteprima').forEach(el=>{
    el.style.setProperty('--scala', el.clientWidth/400);
  });
}
if('ResizeObserver' in window){ new ResizeObserver(aggiornaScale).observe($('griglia')); }
window.addEventListener('resize', aggiornaScale);

/* ---------- Visore ---------- */
let appAperta = null;
function apriApp(a){
  if(!cfg.dentro){ window.open(a.url,'_blank','noopener'); return; }
  appAperta = a;
  $('titoloVisore').textContent = a.nome;
  $('esterno').href = a.url;
  $('caricamento').style.display = 'block';
  $('frameApp').src = a.url;
  $('visore').classList.add('aperto');
  document.body.style.overflow = 'hidden';
  history.pushState({app:a.id}, '', '#'+a.id);
}
function chiudiApp(daStoria){
  if(!$('visore').classList.contains('aperto')) return;
  $('visore').classList.remove('aperto');
  $('frameApp').src = 'about:blank';
  document.body.style.overflow = '';
  appAperta = null;
  if(!daStoria && location.hash) history.back();
}
$('frameApp').addEventListener('load',()=>{ $('caricamento').style.display='none'; });
$('indietro').onclick = ()=>chiudiApp(false);
$('ricarica').onclick = ()=>{ if(appAperta){ $('caricamento').style.display='block'; $('frameApp').src='about:blank'; setTimeout(()=>$('frameApp').src=appAperta.url,50);} };
window.addEventListener('popstate',()=>{
  if($('pannello').classList.contains('aperto')) { chiudiPannello(true); return; }
  chiudiApp(true);
});

/* ---------- Pannello ---------- */
function apriPannello(){ riempiPannello(); $('pannello').classList.add('aperto'); history.pushState({p:1},'','#personalizza'); }
function chiudiPannello(daStoria){
  $('pannello').classList.remove('aperto'); $('areaCodice').style.display='none';
  if(!daStoria && location.hash) history.back();
}
$('apriImpost').onclick = apriPannello;
$('chiudiImpost').onclick = ()=>chiudiPannello(false);
$('sfondoPannello').onclick = ()=>chiudiPannello(false);

function riempiPannello(){
  ['scT','scN','scS','scA'].forEach(k=>{ $('in'+k[0].toUpperCase()+k.slice(1)).value=cfg[k]; $('v'+k[0].toUpperCase()+k.slice(1)).textContent=Math.round(cfg[k]*(k==='scN'?200:100))+'%'; });
  $('cBg1').value=cfg.colori.bg1; $('cBg2').value=cfg.colori.bg2; $('cCard').value=cfg.colori.card;
  $('cTesto').value=cfg.colori.testo; $('cAccento').value=cfg.colori.accento;
  $('inFont').value = cfg.font;
  $('inCol').value = cfg.grandezza; $('vCol').textContent = cfg.grandezza+' px';
  $('inRag').value = cfg.raggio; $('vRag').textContent = cfg.raggio;
  $('inLogo').checked = cfg.logo;
  $('inChit').checked = cfg.chitarra; $('inChitPos').value = cfg.chitarraPos;
  $('inChitOp').value = cfg.chitarraOp; $('vChit').textContent = Math.round(cfg.chitarraOp*100)+'%'; $('inDentro').checked = cfg.dentro;
  disegnaElencoApp();
}

// Temi
TEMI.forEach(t=>{
  const b = document.createElement('button'); b.className='tema'; b.textContent=t.nome;
  b.style.background = `linear-gradient(135deg,${t.bg1},${t.bg2})`;
  b.style.borderColor = t.accento;
  b.onclick = ()=>{ cfg.colori = {bg1:t.bg1,bg2:t.bg2,card:t.card,testo:t.testo,accento:t.accento}; salva(); applicaStile(); riempiPannello(); avviso('Tema "'+t.nome+'" applicato'); };
  $('temi').appendChild(b);
});

$('inLogo') && ($('inLogo').onchange = e=>{ cfg.logo=e.target.checked; salva(); applicaStile(); });

$('inChit').onchange = e=>{ cfg.chitarra=e.target.checked; salva(); applicaStile(); };
$('inChitPos').onchange = e=>{ cfg.chitarraPos=e.target.value; salva(); applicaStile(); };
$('inChitOp').oninput = e=>{ cfg.chitarraOp=+e.target.value; $('vChit').textContent=Math.round(cfg.chitarraOp*100)+'%'; salva(); applicaStile(); };

['scT','scN','scS','scA'].forEach(k=>{
  const K=k[0].toUpperCase()+k.slice(1);
  $('in'+K).oninput = e=>{ cfg[k]=+e.target.value; $('v'+K).textContent=Math.round(cfg[k]*(k==='scN'?200:100))+'%'; salva(); applicaStile(); };
});

// Colori
[['cBg1','bg1'],['cBg2','bg2'],['cCard','card'],['cTesto','testo'],['cAccento','accento']].forEach(([id,k])=>{
  $(id).oninput = e=>{ cfg.colori[k]=e.target.value; salva(); applicaStile(); };
});
$('inFont').onchange = e=>{ cfg.font=e.target.value; salva(); applicaStile(); };
$('inCol').oninput = e=>{ cfg.grandezza=+e.target.value; $('vCol').textContent=cfg.grandezza+' px'; salva(); applicaStile(); };
function zoom(d){ cfg.grandezza=Math.max(90,Math.min(420,cfg.grandezza+d)); salva(); applicaStile(); avviso('Grandezza riquadri: '+cfg.grandezza+' px'); }
$('zMeno').onclick=()=>zoom(-20); $('zPiu').onclick=()=>zoom(20);
$('inRag').oninput = e=>{ cfg.raggio=+e.target.value; $('vRag').textContent=cfg.raggio; salva(); applicaStile(); };
$('inDentro').onchange = e=>{ cfg.dentro=e.target.checked; salva(); };

// Elenco app modificabile
function disegnaElencoApp(){
  const box = $('elencoApp'); box.innerHTML='';
  cfg.app.forEach((a,i)=>{
    const d = document.createElement('div');
    d.className = 'schedaApp'+(a.visibile?'':' nascosta'); d.style.setProperty('--c',a.colore);
    d.innerHTML = `
      <div class="testa">
        <button class="sceltaIcona" aria-label="Cambia icona">${tile(a.icona,a.colore)}</button>
        <div class="nomeApp">${esc(a.nome)}</div>
        <input type="color" value="${esc(a.colore)}" data-k="colore" aria-label="Colore">
      </div>
      <div class="galleria">
        ${Object.keys(ICONE).map(k=>`<button data-ic="${k}" class="${a.icona===k?'sel':''}" aria-label="${k}">${tile(k,a.colore)}</button>`).join('')}
        <div class="riga-emoji">oppure un simbolo/emoji: <input type="text" maxlength="4" value="${ICONE[a.icona]?'':esc(a.icona)}" data-emo="1"></div>
      </div>
      <div class="azioni">
        <button class="btn piccolo" data-az="su" ${i===0?'disabled':''}>▲</button>
        <button class="btn piccolo" data-az="giu" ${i===cfg.app.length-1?'disabled':''}>▼</button>
        <button class="btn piccolo" data-az="vis">${a.visibile?'👁 Visibile':'🚫 Nascosta'}</button>
      </div>`;
    d.querySelectorAll('[data-k]').forEach(inp=>{
      inp.oninput = ()=>{
        a[inp.dataset.k] = inp.value;
        if(inp.dataset.k==='colore'){ d.style.setProperty('--c',a.colore); d.querySelectorAll('.tile').forEach(t=>t.style.setProperty('--colApp',a.colore)); }
        salva();
      };
      inp.onchange = ()=>disegnaHome();
    });
    d.querySelector('.sceltaIcona').onclick = ()=>d.querySelector('.galleria').classList.toggle('aperta');
    d.querySelectorAll('[data-ic]').forEach(btn=>{
      btn.onclick = ()=>{ a.icona=btn.dataset.ic; salva(); disegnaElencoApp(); disegnaHome();
        $('elencoApp').children[i].querySelector('.galleria').classList.add('aperta'); };
    });
    d.querySelector('[data-emo]').onchange = e=>{ const v=e.target.value.trim(); if(v){ a.icona=v; salva(); disegnaElencoApp(); disegnaHome(); } };
    d.querySelectorAll('[data-az]').forEach(btn=>{
      btn.onclick = ()=>{
        const az = btn.dataset.az;
        if(az==='su' && i>0){ [cfg.app[i-1],cfg.app[i]]=[cfg.app[i],cfg.app[i-1]]; }
        if(az==='giu' && i<cfg.app.length-1){ [cfg.app[i+1],cfg.app[i]]=[cfg.app[i],cfg.app[i+1]]; }
        if(az==='vis'){ a.visibile=!a.visibile; }
        if(az==='del'){
          if(btn.dataset.conf!=='1'){ btn.dataset.conf='1'; btn.textContent='Sicuro? Tocca ancora'; return; }
          (cfg.rimosse=cfg.rimosse||[]).push(a.id); cfg.app.splice(i,1); avviso('App eliminata');
        }
        salva(); disegnaElencoApp(); disegnaHome();
      };
    });
    box.appendChild(d);
  });
}

// Esporta / importa / reset
$('esporta').onclick = async ()=>{
  const t = JSON.stringify(cfg);
  try{ await navigator.clipboard.writeText(t); avviso('Impostazioni copiate'); }
  catch(e){ const ar=$('areaCodice'); ar.style.display='block'; ar.value=t; ar.select(); avviso('Copia il testo qui sotto'); }
};
$('importa').onclick = ()=>{
  const ar = $('areaCodice');
  if(ar.style.display!=='block' || !ar.value.trim()){ ar.style.display='block'; ar.value=''; ar.focus(); avviso('Incolla il codice e premi di nuovo'); return; }
  try{
    const o = JSON.parse(ar.value);
    if(!o.app) throw 0;
    cfg = sistema(o);
    salva(); applicaStile(); disegnaHome(); riempiPannello(); ar.style.display='none'; avviso('Impostazioni caricate ✔');
  }catch(e){ avviso('Codice non valido'); }
};
$('reset').onclick = e=>{
  const b = e.currentTarget;
  if(b.dataset.conf!=='1'){ b.dataset.conf='1'; b.textContent='Sicuro? Tocca ancora'; setTimeout(()=>{b.dataset.conf='';b.textContent='↺ Ripristina tutto';},3000); return; }
  cfg = clona(PREDEFINITE); salva(); applicaStile(); disegnaHome(); riempiPannello();
  b.dataset.conf=''; b.textContent='↺ Ripristina tutto'; avviso('Tutto ripristinato');
};

/* ---------- Avvio ---------- */
applicaStile();
disegnaHome();
if(location.hash){ history.replaceState(null,'',location.pathname); }
</script>
